# The pool of app replicas. "app" is the Compose service name: Docker's DNS
# returns one IP per replica, and nginx load-balances across them
# (round-robin by default).
#
# nginx looks the name up when it starts or reloads. After the set of
# replicas changes (a deploy, or `--scale`), provision.sh runs
# `nginx -s reload`, which re-reads this file and the addresses gracefully.
upstream app_servers {
    server app:3000;
}

server {
    listen 80;

    location / {
        proxy_pass http://app_servers;

        # Tell the app who the real client is (otherwise it only sees nginx)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Passive failover: if a replica refuses/times out/returns 502-504,
        # retry the request on the next replica instead of failing the user.
        # Inside a Docker network a connection takes well under 1 ms. A short
        # timeout means a replica that just disappeared costs little.
        proxy_connect_timeout 300ms;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # Answers from nginx itself (no proxying) - used by the container healthcheck
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
