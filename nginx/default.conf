# Docker's embedded DNS server. nginx re-asks it every 5s, so replicas that
# are added, removed or recreated (new IPs) are picked up without a reload.
resolver 127.0.0.11 valid=5s;

# The pool of app replicas. "app" is the Compose service name: Docker DNS
# returns one IP per replica, and nginx load-balances across them
# (round-robin by default).
upstream app_servers {
    zone app_servers 64k;        # shared memory, required by `resolve`
    server app:3000 resolve;
}

server {
    listen 80;

    location / {
        proxy_pass http://app_servers;

        # Tell the app who the real client is (otherwise it only sees nginx)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Passive failover: if a replica refuses/times out/returns 502-504,
        # retry the request on the next replica instead of failing the user.
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # Answers from nginx itself (no proxying) - used by the container healthcheck
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
