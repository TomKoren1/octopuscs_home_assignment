# Fixed project name: container/network names are the same no matter
# which folder the repo is cloned into (e.g. octopus-apples-app-1).
name: octopus-apples

services:
  nginx:
    image: nginx:1.28-alpine
    ports:
      - "${HTTP_PORT:-80}:80"               
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - frontend                            
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}       
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}   
      MONGO_INITDB_DATABASE: store          
    volumes:
      - mongo-data:/data/db                 
      - ./mongo/init:/docker-entrypoint-initdb.d:ro   
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped


  app:
    build: ./app
    environment:
      MONGO_URL: mongodb://mongo:27017      
      MONGO_DB: store
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
    depends_on:
      mongo:
        condition: service_healthy          
    deploy:
      replicas: 2                           
    networks:
      - frontend                            
      - backend                             
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

networks:
  frontend:     # nginx <-> app
  backend:      # app <-> mongo

volumes:
  mongo-data:
