name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Provision and test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    env:
      APP_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Provision from scratch (includes the smoke test)
        run: ./provision.sh

      - name: Show the architecture
        run: ./topology.sh

      - name: Test the buttons and the version label
        run: |
          count() { curl -fsS localhost | sed -n 's/.*id="apples">\([0-9]*\)<.*/\1/p'; }
          [ "$(count)" = 5 ]
          curl -fsS -o /dev/null -d '' localhost/apples
          [ "$(count)" = 6 ]
          curl -fsS -o /dev/null -d '' localhost/apples/reset
          [ "$(count)" = 5 ]
          curl -fsS localhost/health | grep -q "\"version\":\"${GITHUB_SHA}\""

      - name: Test failover (one replica down, the page still works)
        run: |
          docker stop octopus-apples-app-1
          for i in 1 2 3 4; do curl -fsS -o /dev/null localhost; done
          docker start octopus-apples-app-1

      - name: Test a deploy with zero downtime (rolling update)
        run: |
          docker run -d -p 127.0.0.1:5000:5000 registry:2
          for v in v1 v2; do
            docker build -q --build-arg APP_VERSION=$v -t localhost:5000/apples:$v app
            docker push -q localhost:5000/apples:$v
          done
          APP_IMAGE=localhost:5000/apples:v1 ./provision.sh

          ( while true; do curl -s -o /dev/null -m 5 -w '%{http_code}\n' localhost/; sleep 0.05; done > codes.txt ) &
          load=$!
          APP_IMAGE=localhost:5000/apples:v2 ./provision.sh
          kill $load

          echo "Requests during the deploy (count, status):"; sort codes.txt | uniq -c
          [ "$(grep -cv '^200$' codes.txt)" = 0 ]
          curl -fsS localhost/health | grep -q '"version":"v2"'

      - name: Container logs (only if something failed)
        if: failure()
        run: docker compose logs --tail=100

  # Skipped (not failed) while the AWS infra is down: infra/apply.sh sets the variables
  deploy:
    name: Deploy to AWS
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC token for AWS
    env:
      IMAGE: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      SSM_DOCUMENT_NAME: ${{ vars.SSM_DOCUMENT_NAME }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build and push the image, tagged with the commit SHA
        run: |
          # Tags are immutable: on a re-run, reuse the existing image
          repo="${IMAGE%%:*}"
          repo="${repo#*/}"
          if aws ecr describe-images --repository-name "$repo" \
               --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Image $IMAGE already exists - skipping build"
          else
            docker build --build-arg APP_VERSION="$GITHUB_SHA" -t "$IMAGE" app
            docker push "$IMAGE"
          fi

      - name: Deploy on the server (AWS SSM)
        run: |
          cmd_id="$(aws ssm send-command \
            --document-name "$SSM_DOCUMENT_NAME" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --parameters "ImageTag=$GITHUB_SHA" \
            --comment "Deploy $GITHUB_SHA" \
            --query Command.CommandId --output text)"
          echo "SSM command: $cmd_id"

          status=Pending
          for i in $(seq 120); do
            status="$(aws ssm get-command-invocation --command-id "$cmd_id" \
              --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done

          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$EC2_INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Final status: $status"
          [ "$status" = Success ]

      - name: Smoke test the live site
        run: |
          for i in 1 2 3 4; do
            curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$APP_URL/health" \
              | grep -q "\"version\":\"${GITHUB_SHA}\""
          done
          apples="$(curl -fsS "$APP_URL" | sed -n 's/.*id="apples">\([0-9]*\)<.*/\1/p')"
          [ -n "$apples" ]
          echo "Live at $APP_URL - version ${GITHUB_SHA:0:7}, $apples apples" >> "$GITHUB_STEP_SUMMARY"
