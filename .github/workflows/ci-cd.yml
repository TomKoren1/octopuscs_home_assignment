name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; the deploy job asks for more.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- CI ----
  # Runs on every pull request and every push to main. No cloud involved:
  # the whole architecture is provisioned inside the GitHub runner with the
  # same script a human would use, then tested.
  test:
    name: Provision and test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # A newer push to the same PR cancels the older, now pointless, run.
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    env:
      APP_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Provision from scratch (includes the smoke test)
        run: ./provision.sh

      - name: Show the architecture
        run: ./topology.sh

      - name: Test the buttons and the version label
        run: |
          count() { curl -fsS localhost | sed -n 's/.*id="apples">\([0-9]*\)<.*/\1/p'; }
          [ "$(count)" = 5 ]
          curl -fsS -o /dev/null -d '' localhost/apples        # Add an apple
          [ "$(count)" = 6 ]
          curl -fsS -o /dev/null -d '' localhost/apples/reset  # Reset
          [ "$(count)" = 5 ]
          curl -fsS localhost/health | grep -q "\"version\":\"${GITHUB_SHA}\""

      - name: Test failover (one replica down, the page still works)
        run: |
          docker stop octopus-apples-app-1
          for i in 1 2 3 4; do curl -fsS -o /dev/null localhost; done
          docker start octopus-apples-app-1

      - name: Container logs (only if something failed)
        if: failure()
        run: docker compose logs --tail=100

  # ---------------------------------------------------------------- CD ----
  # Runs only for main, only after the tests passed, and only while the AWS
  # infrastructure exists (infra/apply.sh sets the repository variables,
  # infra/destroy.sh removes them - then this job is skipped, not failed).
  deploy:
    name: Deploy to AWS
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Never run two deploys at once, and never cancel one half-way.
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write        # lets the job request an OIDC token for AWS
    env:
      IMAGE: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      SSM_DOCUMENT_NAME: ${{ vars.SSM_DOCUMENT_NAME }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No AWS keys are stored in GitHub. The job proves its identity with a
      # short-lived OIDC token and receives temporary credentials for a role
      # that only the main branch of this repository may assume.
      - name: Log in to AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build and push the image, tagged with the commit SHA
        run: |
          # Tags are immutable in ECR. If this commit was already pushed
          # (a re-run), reuse the image instead of failing.
          repo="${IMAGE%%:*}"      # registry/name, without the tag
          repo="${repo#*/}"        # name only
          if aws ecr describe-images --repository-name "$repo" \
               --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Image $IMAGE already exists - skipping build"
          else
            docker build --build-arg APP_VERSION="$GITHUB_SHA" -t "$IMAGE" app
            docker push "$IMAGE"
          fi

      # The role cannot run arbitrary commands on the server. It may only
      # start one SSM document, whose single parameter is a commit SHA.
      - name: Deploy on the server (AWS SSM)
        run: |
          cmd_id="$(aws ssm send-command \
            --document-name "$SSM_DOCUMENT_NAME" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --parameters "ImageTag=$GITHUB_SHA" \
            --comment "Deploy $GITHUB_SHA" \
            --query Command.CommandId --output text)"
          echo "SSM command: $cmd_id"

          status=Pending
          for i in $(seq 120); do
            status="$(aws ssm get-command-invocation --command-id "$cmd_id" \
              --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done

          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$EC2_INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Final status: $status"
          [ "$status" = Success ]

      - name: Smoke test the live site
        run: |
          # Both replicas must report the commit we just deployed...
          for i in 1 2 3 4; do
            curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$APP_URL/health" \
              | grep -q "\"version\":\"${GITHUB_SHA}\""
          done
          # ...and the page must show an apple count.
          apples="$(curl -fsS "$APP_URL" | sed -n 's/.*id="apples">\([0-9]*\)<.*/\1/p')"
          [ -n "$apples" ]
          echo "Live at $APP_URL - version ${GITHUB_SHA:0:7}, $apples apples" >> "$GITHUB_STEP_SUMMARY"
